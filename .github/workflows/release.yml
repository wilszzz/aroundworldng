name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release AroundWorldNG
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fast.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller -y AroundWorldNG.spec

      - name: Package standalone distribution
        run: |
          Copy-Item -Path "mod" -Destination "dist\AroundWorldNG\mod" -Recurse
          Copy-Item -Path "aroundworldng" -Destination "dist\AroundWorldNG\aroundworldng" -Recurse -Exclude "__pycache__"
          New-Item -ItemType Directory -Path "dist\AroundWorldNG\_internal\aroundworldng" -Force
          Copy-Item -Path "aroundworldng\fast_tree_materials.json", "aroundworldng\ready_packs.json", "aroundworldng\terrain_materials.json", "aroundworldng\road_materials.json" -Destination "dist\AroundWorldNG\_internal\" -Force
          Copy-Item -Path "aroundworldng\fast_tree_materials.json", "aroundworldng\ready_packs.json", "aroundworldng\terrain_materials.json", "aroundworldng\road_materials.json" -Destination "dist\AroundWorldNG\_internal\aroundworldng\" -Force
          New-Item -ItemType Directory -Path "dist\AroundWorldNG\data\geofabrik" -Force
          Copy-Item -Path "data\geofabrik\*" -Destination "dist\AroundWorldNG\data\geofabrik\" -Force
          New-Item -ItemType Directory -Path "dist\AroundWorldNG\data\pbf" -Force
          New-Item -ItemType Directory -Path "dist\AroundWorldNG\data\osm_tiles" -Force
          Copy-Item -Path "README.md", "README.txt", "LICENSE", "THIRD_PARTY_NOTICES.md", "preview_detailing.png", "BUILD_INFO.json" -Destination "dist\AroundWorldNG\"
          Set-Content -Path "dist\AroundWorldNG\country_setup.json" -Value '{\n "mods": "",\n "bookmarks": []\n}'
          Compress-Archive -Path dist\AroundWorldNG\* -DestinationPath AroundWorldNG-Standalone-Win64.zip

      - name: Package lightweight source distribution
        run: |
          Compress-Archive -Path AroundWorldNG.bat, Setup.bat, requirements-fast.txt, README.md, README.txt, LICENSE, THIRD_PARTY_NOTICES.md, BUILD_INFO.json, preview_detailing.png, aroundworldng, mod, data -DestinationPath AroundWorldNG-Source.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AroundWorldNG-Standalone-Win64.zip
            AroundWorldNG-Source.zip
          generate_release_notes: true
          draft: false
          prerelease: false
